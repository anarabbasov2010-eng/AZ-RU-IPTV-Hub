name: Update IPTV catalog

on:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/**"
      - ".github/workflows/update.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: iptv-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip PyYAML pytest
      - name: Build
        run: python scripts/pipeline.py --config config/sources.yml
      - name: Validate
        run: python scripts/validate.py && pytest -q
      - name: Commit generated catalog
        run: |
          git config user.name "AZ-RU-IPTV-Hub Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlists data status
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "chore: refresh IPTV catalog"
            git push
          fi
