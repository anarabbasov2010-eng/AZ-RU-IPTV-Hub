name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip PyYAML pytest
      - run: pytest -q
      - run: |
          if [ -f status/health.json ]; then python scripts/validate.py; else echo "No generated catalog yet; structural tests passed."; fi
