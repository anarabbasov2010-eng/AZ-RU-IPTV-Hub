  prefer_hls: true
  prefer_resolution: true
  prefer_bitrate: true
  latency_weight: 0.15
  stability_weight: 0.35
  resolution_weight: 0.25
  bitrate_weight: 0.15
  https_weight: 0.10

metadata:
  enabled: true
  api_url: https://iptv-org.github.io/api/channels.json
